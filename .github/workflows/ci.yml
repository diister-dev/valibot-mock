name: CI
on:
  push:
    branches:
      - main
      - develop
      - release/*
  pull_request:
    branches:
      - main
      - develop
      - release/*

defaults:
  run:
    working-directory: library

jobs:
  static:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run fmt:check

      - name: Build
        run: bun run build

  test:
    name: Tests (${{ matrix.runtime }})
    runs-on: ubuntu-latest

    # The suite is written against `node:test`, which all three runtimes
    # implement, so the SAME tests run everywhere. That is the point: a
    # single-runner suite only exercises one engine, and running Node is what
    # caught the parameter properties its type stripping cannot erase.
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node, deno]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18

      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.9.6

      - run: bun install --frozen-lockfile

      - name: Test (bun)
        if: matrix.runtime == 'bun'
        run: bun test

      - name: Test (node)
        if: matrix.runtime == 'node'
        run: node --test "test/*_test.ts"

      - name: Test (deno)
        if: matrix.runtime == 'deno'
        run: deno test -A --no-check test/

  consumers:
    name: Consume the built package (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    needs: static

    # The package is published for Node and Bun, not just built by them. These
    # jobs install the real tarball into an empty project, which is the only
    # thing that exercises the `exports` map and the generated `.d.ts` the way a
    # user does — including that `valibot` resolves to the CONSUMER's copy,
    # which is the whole point of it being a peer dependency.
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18

      - run: bun install --frozen-lockfile

      - name: Build and pack
        run: |
          bun run build
          npm pack --pack-destination /tmp

      - name: Install into an empty project
        working-directory: /tmp
        run: |
          mkdir -p consumer && cd consumer
          echo '{"name":"consumer","type":"module","private":true}' > package.json
          npm install /tmp/diister-valibot-mock-*.tgz valibot

      - name: Generate a mock and validate it
        working-directory: /tmp/consumer
        run: |
          cat > check.js <<'EOF'
          import { createMockGenerator } from "@diister/valibot-mock";
          import * as v from "valibot";
          const schema = v.object({
            name: v.pipe(v.string(), v.minLength(3)),
            email: v.pipe(v.string(), v.email()),
            age: v.pipe(v.number(), v.integer()),
          });
          const out = createMockGenerator(schema).generate();
          if (!v.safeParse(schema, out).success) {
            throw new Error("generated mock did not satisfy its own schema");
          }
          console.log("generated and validated:", JSON.stringify(out));
          EOF
          ${{ matrix.runtime }} check.js
